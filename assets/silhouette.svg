             C 110 18, 103 26, 103 38 
             C 103 52, 110 63, 114 68 
             L 116 76 L 124 76 L 126 68 
             C 130 63, 137 52, 137 38 
             C 137 26, 130 18, 120 18 Z" 
          class="limb-path" />
  </g>

  <!-- Torso (Tronco) -->
  <g id="svg-limb-torso" class="body-limb" data-limb="torso">
    <path d="M 116 76
             C 112 78, 98 83, 90 92
             C 86 97, 88 106, 89 122
             C 90 138, 92 154, 91 170
             C 90 182, 87 194, 88 206
             C 89 214, 96 222, 108 226
