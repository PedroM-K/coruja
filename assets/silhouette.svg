<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 460" id="body-mannequin-svg" class="mannequin-svg">
  <defs>
    <filter id="limbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Head / Cabeça (part of Torso/Upper Body in Oblívio) -->
  <g id="svg-limb-head" class="body-limb" data-limb="torso">
