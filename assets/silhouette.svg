    <!-- Shoulder, Upper arm, Forearm, Hand -->
    <path d="M 152 94
             C 158 96, 166 105, 169 116
             C 172 128, 176 148, 180 168
             C 183 182, 187 200, 192 214
             C 195 221, 200 230, 204 238
             L 206 246
